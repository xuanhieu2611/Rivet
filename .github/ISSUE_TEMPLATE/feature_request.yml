name: Feature request
description: Propose a focused improvement to Rivet
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem or limitation should Rivet address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
  - type: textarea
    id: invariants
    attributes:
      label: Invariants and risks
      description: Note any effect on sandbox isolation, credentials, durable state, recovery, validation, or external side effects.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I have read the documented scope and known limitations in the README.
          required: true
