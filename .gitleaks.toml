# gitleaks configuration for Rivet.
#
# Extends the upstream default rule set rather than replacing it: the default
# rules are maintained against real credential formats, and a hand-written
# subset would silently stop covering whatever it forgot.
#
# Every entry below must carry a comment saying either that the matched value is
# provably not a live credential (a test fixture, a documented sentinel, a public
# key) or why it cannot be removed. An entry with no comment is a bug - see
# docs/security-review.md §5.

title = "Rivet"

[extend]
useDefault = true

[allowlist]
description = "Values and paths that cannot contain a live credential."

regexes = [
  # Acceptance run F writes this exact synthetic value through every durable
  # redaction path. Keeping the literal in its tests is the positive control.
  '''sentinel-secret-value''',
]

paths = [
  # Lockfiles carry integrity hashes, which are high-entropy by construction and
  # are not secrets.
  '''pnpm-lock\.yaml''',
]
